[project]
name = "depfresh"
version = "0.1.0"
description = "Check if pyproject.toml dependencies are up to date with PyPI — no install required"
authors = [
    { name = "thejedi433", email = "thejedi433@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "packaging>=24.0",
]

[project.scripts]
depfresh = "depfresh:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
