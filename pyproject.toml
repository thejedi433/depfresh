[project]
name = "depfresh"
version = "0.1.0"
description = "Check if pyproject.toml dependencies are up to date with PyPI — no install required"
authors = [
    { name = "thejedi433", email = "thejedi433@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "packaging>=26.3",
]

[project.scripts]
depfresh = "depfresh:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["depfresh"]
branch = true
omit = ["tests/*", "src/depfresh/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]
